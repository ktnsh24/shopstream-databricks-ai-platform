[tool.poetry]
name = "shopstream-databricks-ai-platform"
version = "0.1.0"
description = "ShopStream AI platform — ML models, AI agent, and API gateway on Azure Databricks"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pyspark = "^3.5"
delta-spark = "^3.1"
lightgbm = "^4.3"
mlflow = "^2.13"
databricks-sdk = "^0.27"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
httpx = "^0.27"
pydantic = "^2.7"
pydantic-settings = "^2.3"
loguru = "^0.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
respx = "^0.21"
ruff = "^0.4"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
